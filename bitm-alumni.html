<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BITM Ballari - Alumni Directory</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body, html {
      height: 100%;
      background: url('https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1600&q=80')
      no-repeat center center/cover;
      color: #fff;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 2rem;
      color: #ffcc80;
    }

    nav button {
      background: #ff9800;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
    }

    nav button:hover {
      background: #e68900;
    }

    .page-header {
      margin-bottom: 20px;
    }

    .page-header h2 {
      font-size: 1.8rem;
      margin-bottom: 5px;
      color: #ffd28a;
    }

    .alumni-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .alumni-card {
      background: rgba(255,255,255,0.1);
      padding: 18px;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      transition: transform 0.2s ease;
    }

    .alumni-card:hover {
      transform: scale(1.03);
    }

    .alumni-name-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .alumni-name-row h3 {
      font-size: 1.2rem;
      color: #ffe0b3;
    }

    .alumni-meta {
      font-size: 0.9rem;
      margin: 6px 0;
      opacity: 0.9;
    }

    .chips {
      margin: 10px 0;
    }

    .chip {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 5px 10px;
      margin-right: 6px;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    .alumni-help {
      margin: 10px 0 15px;
      font-size: 0.9rem;
    }

    .alumni-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .ghost-btn {
      padding: 8px 12px;
      border: 1px solid #ffcc80;
      background: transparent;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
      color: #ffe0b3;
    }

    .ghost-btn:hover {
      background: rgba(255,255,255,0.15);
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal {
      width: 90%;
      max-width: 480px;
      background: #222;
      padding: 20px;
      border-radius: 12px;
      color: #fff;
      position: relative;
    }

    .modal-close {
      position: absolute;
      right: 15px;
      top: 10px;
      cursor: pointer;
      font-size: 1.3rem;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    textarea {
      height: 90px;
      resize: none;
    }

    .previous-questions {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid #555;
    }

    .question-item {
      background: rgba(255,255,255,0.1);
      margin-top: 8px;
      padding: 8px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  const alumniGrid = document.getElementById("alumniGrid");

  function renderAlumni() {
    alumniGrid.innerHTML = "";
    ALUMNI.forEach(a => {
      alumniGrid.innerHTML += `
        <div class="alumni-card">
          <div class="alumni-name-row">
            <h3>${a.name}</h3>
            <span>${a.gradYear}</span>
          </div>
          <div class="alumni-meta">
            Dept: ${a.department} • ${a.domain} @ ${a.company}
          </div>
          <div class="chips">
            ${a.skills.map(s => `<span class="chip">${s}</span>`).join("")}
          </div>
          <div class="alumni-help">
            <strong>I can help with:</strong> ${a.canHelpWith}
          </div>
          <div class="alumni-actions">
            <button class="ghost-btn" onclick="openRequest('${a.id}')">Request Guidance</button>
            <button class="ghost-btn" onclick="openProfile('${a.id}')">View Profile</button>
          </div>
        </div>
      `;
    });
  }

  const modal = document.getElementById("requestModalBackdrop");
  const modalName = document.getElementById("modalAlumniName");
  const closeModalBtn = document.getElementById("closeModal");
  const requestForm = document.getElementById("requestForm");
  const previousQ = document.getElementById("previousQuestions");

  let currentAlumni = null;

  function openRequest(id) {
    currentAlumni = ALUMNI.find(a => a.id === id);
    modalName.textContent = `Request Guidance from ${currentAlumni.name}`;
    modal.classList.add("active");
    loadPreviousQuestions();
  }

  function openProfile(id) {
    const profile = MENTOR_PROFILES[id];
    if (!profile) {
      alert('Profile coming soon for this mentor.');
      return;
    }
    localStorage.setItem('selectedMentor', JSON.stringify(profile));
    window.location.href = 'mentor-profile.html';
  }

  closeModalBtn.onclick = () => modal.classList.remove("active");
  modal.onclick = e => { if (e.target === modal) modal.classList.remove("active") };

  requestForm.addEventListener("submit", e => {
    e.preventDefault();
    if (!currentAlumni) return;

    const req = {
      collegeId: COLLEGE_ID,
      alumniId: currentAlumni.id,
      studentName: document.getElementById("studentName").value,
      studentEmail: document.getElementById("studentEmail").value,
      question: document.getElementById("studentQuestion").value,
      createdAt: new Date().toISOString()
    };

    const stored = JSON.parse(localStorage.getItem("mentorshipRequests") || "[]");
    stored.push(req);
    localStorage.setItem("mentorshipRequests", JSON.stringify(stored));

    alert("Your request has been sent!");
    requestForm.reset();
    loadPreviousQuestions();
  });

  function loadPreviousQuestions() {
    const stored = JSON.parse(localStorage.getItem("mentorshipRequests") || "[]");
    const related = stored.filter(r => r.alumniId === (currentAlumni && currentAlumni.id));

    if (!related.length) {
      previousQ.innerHTML = "<p>No previous questions.</p>";
      return;
    }

    previousQ.innerHTML = related
      .reverse()
      .map(q => `
        <div class="question-item">
          <strong>${q.studentName}</strong>
          <p>${q.question}</p>
          <small>${new Date(q.createdAt).toLocaleString()}</small>
        </div>
      `)
      .join("");
  }

  renderAlumni();
