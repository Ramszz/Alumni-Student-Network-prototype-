<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login - NIT Alumni Mentor Connect</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-full relative">

  <!-- Loading Screen -->
  <div id="spinnerOverlay"
    class="hidden fixed inset-0 bg-black bg-opacity-80 flex flex-col items-center 
           justify-center text-white text-xl space-y-4 z-50">

    <!-- Spinner -->
    <div class="h-16 w-16 rounded-full border-4 border-white border-t-amber-400 animate-spin"></div>

    <p class="text-amber-300 font-semibold">Redirecting to Dashboard...</p>
  </div>


  <!-- Background Image -->
  <div class="relative h-screen w-full 
      bg-cover bg-center bg-no-repeat" 
      style="background-image: url('https://images.pexels.com/photos/3184360/pexels-photo-3184360.jpeg');">

    <!-- Dark overlay -->
    <div class="absolute inset-0 bg-black bg-opacity-60"></div>

    <!-- Login Form -->
    <div class="relative z-10 h-full flex items-center justify-center px-4">

      <div class="w-full max-w-sm 
          bg-white/20 backdrop-blur-xl 
          shadow-2xl rounded-2xl 
          p-8 text-white">

        <h2 class="text-3xl font-semibold text-center text-amber-300 mb-6">
          <i class="fa-solid fa-right-to-bracket mr-2"></i> Login
        </h2>

        <form id="loginForm" class="space-y-4">

          <div>
            <label class="block text-sm mb-1">Email ID</label>
            <input type="email" id="email" required
              class="w-full px-3 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-amber-300 outline-none" 
              placeholder="Enter your email">
          </div>

          <div>
            <label class="block text-sm mb-1">Password</label>
            <input type="password" id="password" required
              class="w-full px-3 py-2 rounded-lg text-gray-800 focus:ring-2 focus:ring-amber-300 outline-none" 
              placeholder="Enter your password">
          </div>

          <button type="submit"
            class="w-full py-2 rounded-lg font-semibold 
            bg-gradient-to-r from-amber-500 to-orange-400 
            hover:scale-105 transition">
            Login
          </button>
        </form>

        <p class="text-center text-sm mt-3">
          Don't have an account?
          <a href="signup.html" class="text-amber-300 font-semibold hover:underline">
            Sign Up
          </a>
        </p>

      </div>
    </div>

  </div>


  <!-- LOGIN SCRIPT -->
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();

      const allUsers = JSON.parse(localStorage.getItem('allUsers')) || [];
      const user = allUsers.find(u => u.email === email && u.password === password);

      if (!user) {
        alert('Invalid email or password!');
        return;
      }

      // Save login
      localStorage.setItem('loggedInUser', JSON.stringify(user));

      // Show loading screen
      document.getElementById('spinnerOverlay').classList.remove("hidden");

      // Redirect after animation delay
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    });
    // After setting loggedInUser in localStorage

  </script>

  <!-- Font Awesome Icons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

</body>
</html>
