<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Student Directory Hub - Alumni-Student Network</title>
<style>
  :root {
    --accent: #ff9800;
    --card-bg: rgba(17,24,39,0.9);
    --muted: #9ca3af;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: 'Segoe UI', sans-serif;
    margin:0;
    padding:40px 20px;
    min-height:100vh;
    background-image: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d?auto=format&fit=crop&w=1600&q=80');
    background-size: cover;
    background-position: center;
    position: relative;
    color: #f9fafb;
  }

  body::before {
    content:"";
    position: fixed;
    inset:0;
    background: rgba(12,18,25,0.6);
    z-index:0;
    pointer-events:none;
  }

  .wrap {
    position: relative;
    z-index:1;
    max-width: 980px;
    margin:0 auto;
  }

  header {
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }

  h1 { color:#fff; margin:0; font-size:1.8rem; letter-spacing:0.2px; }
  .subtitle { color: #e5e7eb; font-size:0.95rem; margin-top:6px; max-width:540px; }

  /* College grid */
  .college-grid {
    margin-top:18px;
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap:18px;
  }

  .college-card {
    position:relative;
    background: var(--card-bg);
    border-radius:18px;
    padding:14px 14px 16px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.5);
    cursor:pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    overflow:hidden;
    display:flex;
    align-items:flex-start;
    gap:12px;
  }

  .college-card::before {
    content:"";
    position:absolute;
    inset:-40%;
    background: radial-gradient(circle at top left, rgba(255,152,0,0.32), transparent 55%);
    opacity:0;
    transition:opacity 0.2s ease;
    pointer-events:none;
  }

  .college-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 36px rgba(0,0,0,0.7);
    background: rgba(17,24,39,0.98);
  }
  .college-card:hover::before {
    opacity:1;
  }

  /* Floating avatar circle */
  .avatar-circle {
    flex-shrink:0;
    width:46px;
    height:46px;
    border-radius:999px;
    background: radial-gradient(circle at 30% 0%, #fed7aa, #f97316);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:1rem;
    color:#111827;
    box-shadow:0 8px 20px rgba(0,0,0,0.45);
  }

  .college-info {
    flex:1;
    min-width:0;
  }

  .college-name {
    font-weight:600;
    font-size:0.98rem;
    color:#fefce8;
    margin-bottom:4px;
  }
  .college-city {
    font-size:0.82rem;
    color:var(--muted);
    margin-bottom:6px;
  }
  .college-meta {
    font-size:0.8rem;
    color:#e5e7eb;
    opacity:0.92;
  }

  .empty {
    color:#e6e6e6;
    padding:40px 16px;
    text-align:center;
    background: rgba(15,23,42,0.7);
    border-radius:14px;
    margin-top:18px;
  }

  /* Floating Search – filters colleges by name/city */
  .search-fab {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 20;
    display:flex;
    align-items:center;
    gap:8px;
    transition: all .22s ease;
  }

  .search-btn {
    width:52px;
    height:52px;
    border-radius:50%;
    background: rgba(15,23,42,0.7);
    border: 1px solid rgba(248,250,252,0.16);
    backdrop-filter: blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow: 0 6px 18px rgba(2,6,23,0.65);
  }
  .search-btn svg { width:22px; height:22px; fill:#fff; }

  .search-input {
    width:0;
    opacity:0;
    transform: translateX(10px);
    transition: all .18s ease;
    border-radius:999px;
    overflow:hidden;
    display:flex;
    align-items:center;
    background: rgba(248,250,252,0.96);
    box-shadow: 0 6px 18px rgba(2,6,23,0.55);
    border:none;
  }
  .search-input.open { width:320px; opacity:1; transform: translateX(0); }
  .search-input input {
    padding:12px 14px;
    border:none;
    outline:none;
    width:100%;
    font-size:0.95rem;
    color:#0b1220;
    background: transparent;
  }

  /* Scroll to top FAB */
  .top-fab {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index:20;
    width:52px;
    height:52px;
    border-radius:50%;
    background: var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    box-shadow: 0 8px 26px rgba(0,0,0,0.55);
    cursor:pointer;
    opacity:0;
    transform: translateY(10px);
    transition: all .2s ease;
  }
  .top-fab.visible { opacity:1; transform: translateY(0); }
  .top-fab svg { width:20px; height:20px; fill:#fff; }

  /* Dashboard FAB */
  .dashboard-fab {
    position: fixed;
    left: 18px;
    bottom: 18px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap:8px;
    padding:10px 16px;
    background: var(--accent);
    color:#fff;
    font-weight:600;
    font-size:0.95rem;
    border-radius:50px;
    box-shadow:0 8px 26px rgba(0,0,0,0.55);
    text-decoration:none;
    transition: all 0.2s ease;
  }
  .dashboard-fab:hover { background:#e68900; transform: translateY(-3px); }
  .dashboard-fab svg { display:block; }

  @media(max-width:560px){
    .search-input.open { width: calc(100vw - 110px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Student Directory Hub</h1>
      <div class="subtitle">
        Pick your college to view all students who have created profiles under that institution.
      </div>
    </div>
  </header>

  <div id="collegeGrid" class="college-grid"></div>
</div>

<!-- Floating Search (for colleges) -->
<div class="search-fab" aria-hidden="false">
  <div class="search-input" id="searchInputWrap" role="search">
    <input id="searchInput" placeholder="Search colleges by name or city..." aria-label="Search colleges">
  </div>
  <button class="search-btn" id="searchBtn" title="Search colleges">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM10 14a4 4 0 110-8 4 4 0 010 8z"/>
    </svg>
  </button>
</div>

<!-- Scroll to top FAB -->
<button id="toTop" class="top-fab" title="Scroll to top" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4.59 15.41L12 8l7.41 7.41L21 14l-9-9-9 9z"/>
  </svg>
</button>

<!-- Dashboard FAB -->
<a href="dashboard.html" class="dashboard-fab">
  <svg xmlns="http://www.w3.org/2000/svg" fill="#fff" viewBox="0 0 24 24" width="20" height="20">
    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
  </svg>
  <span>Dashboard</span>
</a>

<script>
(function(){
  const collegeGrid = document.getElementById('collegeGrid');

  // 10+ colleges with avatar initials
  const COLLEGES = [
    { name: 'Ballari Institute of Technology & Management (BITM)', city: 'Ballari', initials: 'BT' },
    { name: 'Nagarjuna Institute of Technology', city: 'Bengaluru', initials: 'NI' },
    { name: 'Navadev Institute of Technology', city: 'Ballari', initials: 'NV' },
    { name: 'JNTU Hyderabad College of Engineering', city: 'Hyderabad', initials: 'JH' },
    { name: 'Dayananda Sagar College of Engineering', city: 'Bengaluru', initials: 'DS' },
    { name: 'R.V. College of Engineering', city: 'Bengaluru', initials: 'RV' },
    { name: 'PES University', city: 'Bengaluru', initials: 'PES' },
    { name: 'BMS College of Engineering', city: 'Bengaluru', initials: 'BM' },
    { name: 'M.S. Ramaiah Institute of Technology', city: 'Bengaluru', initials: 'MR' },
    { name: 'VNR Vignana Jyothi Institute of Engg & Tech', city: 'Hyderabad', initials: 'VNR' },
    { name: 'Vidya Jyothi Institute of Technology (VJIT)', city: 'Hyderabad', initials: 'VJ' },
    { name: 'Chaitanya Bharathi Institute of Technology', city: 'Hyderabad', initials: 'CB' },
    { name: 'MLR Institute of Technology', city: 'Hyderabad', initials: 'MLR' },
    { name: 'SLN College of Engineering', city: 'Raichur', initials: 'SLN' },
    { name: 'Bangalore Institute of Technology', city: 'Bengaluru', initials: 'BIT' }
  ];

  function renderColleges(filterText){
    const q = (filterText || '').trim().toLowerCase();
    const filtered = q
      ? COLLEGES.filter(c =>
          c.name.toLowerCase().includes(q) ||
          c.city.toLowerCase().includes(q) ||
          (c.initials || '').toLowerCase().includes(q)
        )
      : COLLEGES;

    if(!filtered.length){
      collegeGrid.innerHTML = '<div class="empty">No colleges match your search.</div>';
      return;
    }

    collegeGrid.innerHTML = filtered.map(c => `
      <div class="college-card" onclick="goToCollege('${encodeURIComponent(c.name)}')">
        <div class="avatar-circle">${c.initials}</div>
        <div class="college-info">
          <div class="college-name">${c.name}</div>
          <div class="college-city">${c.city}</div>
          <div class="college-meta">Click to view students registered under this college.</div>
        </div>
      </div>
    `).join('');
  }

  window.goToCollege = function(collegeNameEncoded){
    window.location.href = 'students-by-college.html?college=' + collegeNameEncoded;
  };

  renderColleges('');

  const searchBtn = document.getElementById('searchBtn');
  const searchWrap = document.getElementById('searchInputWrap');
  const searchInput = document.getElementById('searchInput');
  let searchOpen = false;

  function openSearch(){ searchWrap.classList.add('open'); searchInput.focus(); searchOpen=true; }
  function closeSearch(){ searchWrap.classList.remove('open'); searchInput.value=''; renderColleges(''); searchOpen=false; }

  searchBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if(!searchOpen) openSearch();
    else {
      if(searchInput.value.trim()){
        searchInput.value = '';
        renderColleges('');
        searchInput.focus();
      } else {
        closeSearch();
      }
    }
  });

  document.addEventListener('click', function(e){
    if(!searchWrap.contains(e.target) && !searchBtn.contains(e.target) && searchOpen){
      closeSearch();
    }
  });

  searchInput.addEventListener('input', function(){
    renderColleges(this.value);
  });

  searchInput.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeSearch();
  });

  const toTop = document.getElementById('toTop');
  function checkScroll(){
    if(window.scrollY > 300) toTop.classList.add('visible');
    else toTop.classList.remove('visible');
  }
  window.addEventListener('scroll', checkScroll);
  checkScroll();
  toTop.addEventListener('click', function(){
    window.scrollTo({top:0, behavior:'smooth'});
  });
})();
</script>
</body>
</html>
