<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Branch Notes | Alumni Student Network</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
  body { background: #f5f5f5; color: #333; }

  nav {
    position: sticky;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 50px;
    background: rgba(0,0,0,0.9);
    color: #fff;
    z-index: 1000;
  }
  nav h1 { font-size: 22px; }
  nav button {
    background: #ff9800;
    border: none;
    padding: 8px 18px;
    border-radius: 6px;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }
  nav button:hover { background: #e68900; }

  .container {
    max-width: 1100px;
    margin: 30px auto 40px;
    padding: 0 20px;
  }

  .branch-title {
    font-size: 28px;
    margin-bottom: 4px;
  }
  .branch-meta {
    font-size: 13px;
    color: #777;
    margin-bottom: 20px;
  }

  .semester-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
  }

  .semester-card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 14px 12px;
    box-shadow: 0 8px 18px rgba(0,0,0,0.08);
  }

  .semester-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .subject-list {
    list-style: none;
    font-size: 14px;
  }
  .subject-list li {
    padding: 4px 0;
    border-bottom: 1px dashed #eee;
  }
  .subject-list li:last-child {
    border-bottom: none;
  }

  .subject-list span.code {
    font-weight: 700;
    margin-right: 4px;
  }

  .note-placeholder {
    font-size: 12px;
    color: #999;
  }

  footer {
    text-align: center;
    font-size: 13px;
    color: #777;
    padding: 10px 0 25px;
  }

  @media (max-width: 768px) {
    nav {
      padding: 12px 16px;
    }
  }
</style>
</head>

  // ====== HELPER: get query param ======
  function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function renderPage() {
    const branchCode = getQueryParam('branch') || 'CSE';
    const data = subjectsData[branchCode];

    const branchHeading = document.getElementById('branchHeading');
    const branchMeta = document.getElementById('branchMeta');
    const semesterGrid = document.getElementById('semesterGrid');
    const branchNavTitle = document.getElementById('branchNavTitle');

    if (!data) {
      branchHeading.textContent = 'Unknown Branch';
      branchMeta.textContent = 'Branch not found. Please go back and choose again.';
      semesterGrid.innerHTML = '';
      branchNavTitle.textContent = 'Branch Notes';
      return;
    }

    branchHeading.textContent = branchCode + ' - ' + data.fullName;
    branchMeta.textContent = 'Subjects grouped semester-wise. Edit this page to add note links, PDFs, or Drive URLs.';
    branchNavTitle.textContent = branchCode + ' Notes';

    semesterGrid.innerHTML = '';

    Object.entries(data.semesters).forEach(([semName, subjects]) => {
      const card = document.createElement('div');
      card.className = 'semester-card';

      const title = document.createElement('div');
      title.className = 'semester-title';
      title.textContent = semName;

      const ul = document.createElement('ul');
      ul.className = 'subject-list';

      subjects.forEach((subj, index) => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="code">S${index + 1}.</span> ${subj}<div class="note-placeholder">[Add note links here]</div>`;
        ul.appendChild(li);
      });

      card.appendChild(title);
      card.appendChild(ul);

      semesterGrid.appendChild(card);
    });
  }

  renderPage();
